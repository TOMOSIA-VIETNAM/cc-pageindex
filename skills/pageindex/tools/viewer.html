<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document index</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f2; --panel: #ffffff; --line: #e3e1dc; --ink: #1c1b19;
  --muted: #6d6a64; --accent: #5b45e0; --warn: #b4520f; --hit: #ffe9a8;
  --edge: #a29e94; --dot: #d6d3cb;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 6px 20px rgb(0 0 0 / .07);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP",
          sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131317; --panel: #1c1c21; --line: #2e2d35; --ink: #e9e7e4;
  --muted: #9a958d; --accent: #a892ff; --warn: #e2883f; --hit: #4a3f14;
  --edge: #5f5c66; --dot: #2a2930;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 6px 20px rgb(0 0 0 / .35);
}
* { box-sizing: border-box; }
.embed nav.docs, .embed .head, .embed footer { display: none; }
.embed .shell, .embed main { height: 100vh; min-height: 0; }
/* one finger scrolls the host page vertically; horizontal drags and two fingers move the board */
.embed .board { touch-action: pan-y; }
.embed .hint-touch { display: none; }
@media (max-width: 720px) { .embed #expand, .embed #collapse { display: none; } }
@media (pointer: coarse) {
  .embed .hint-mouse { display: none; }
  .embed .hint-touch { display: inline; }
}
.head-tools { display: flex; gap: 8px; align-items: center; flex: none; }
.theme { border: 1px solid var(--line); background: var(--panel); width: 36px;
  height: 36px; border-radius: 8px; display: grid; place-items: center; }
.theme:hover { border-color: var(--muted); }
.theme svg { width: 17px; height: 17px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme .moon, :root[data-theme="dark"] .theme .sun { display: none; }
:root[data-theme="dark"] .theme .moon { display: block; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 var(--sans);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.board:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.shell { display: flex; height: 100vh; }

/* document list */
nav.docs {
  width: 260px; flex: none; border-right: 1px solid var(--line);
  background: var(--panel); padding: 16px 0; overflow-y: auto;
}
nav.docs h1 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin: 0 16px 10px; font-weight: 600; }
nav.docs button {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  padding: 8px 16px; border-left: 3px solid transparent; overflow-wrap: anywhere;
}
nav.docs button:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
nav.docs button[aria-current="true"] {
  border-left-color: var(--accent); font-weight: 600;
  background: color-mix(in srgb, var(--accent) 13%, transparent);
}
nav.docs .meta { display: block; color: var(--muted); font-size: 12px;
  font-weight: 400; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.head { display: flex; gap: 16px; align-items: flex-start;
  justify-content: space-between; padding: 16px 24px 0; }
.head h2 { margin: 0 0 2px; font-size: 19px; line-height: 1.3; }
.head p { margin: 0; color: var(--muted); font-size: 13px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); padding: 2px; flex: none; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px;
  color: var(--muted); }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--ink); font-weight: 600;
}
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 12px 24px; border-bottom: 1px solid var(--line); }
input[type=search] {
  flex: 1; min-width: 200px; padding: 7px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: inherit;
  font: inherit;
}
.bar > button, label.chk {
  border: 1px solid var(--line); background: var(--panel);
  padding: 6px 11px; border-radius: 8px;
}
.bar > button:hover, label.chk:hover { border-color: var(--muted); }
label.chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hits { color: var(--muted); font-size: 12px; font-family: var(--mono);
  min-width: 0; }
footer { color: var(--muted); font-size: 12px; padding: 6px 24px;
  border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.view { flex: 1; min-height: 0; }

/* list view */
.list { overflow: auto; padding: 16px 24px 40px; }
.node { border-left: 1px solid var(--line); margin-left: 9px;
  padding-left: 13px; }
.row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.twist { width: 15px; flex: none; border: 0; background: none; color: var(--muted);
  padding: 0; }
.twist.leaf { visibility: hidden; }
.nid { font-family: var(--mono); font-size: 12px; color: var(--muted);
  flex: none; }
.title { font-weight: 500; }
.units { font-family: var(--mono); font-size: 12px; color: var(--muted);
  flex: none; }
.missing .title { color: var(--warn); }
.missing .title::after { content: " ·未要約"; font-size: 11px; }
.sum { color: var(--muted); margin: 0 0 4px 46px; max-width: 78ch; }
mark { background: var(--hit); color: inherit; border-radius: 2px; }
.hidden { display: none; }

/* graph view: an unbounded board, moved by dragging */
.graph { position: relative; overflow: hidden; }
.board {
  position: absolute; inset: 0; cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none;
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px);
}
.board.panning { cursor: grabbing; }
#stage { display: block; width: 100%; height: 100%; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.3;
  transition: opacity .16s, stroke .16s; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 12;
  pointer-events: stroke; cursor: pointer; }
.edge.lit { stroke: var(--accent); stroke-width: 1.9; stroke-dasharray: 6 5;
  animation: flow .7s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -11; } }
.gnode { cursor: pointer; transition: opacity .16s; outline: none; }
.gnode .hitc { fill: transparent; }
.gnode .ring { fill: none; stroke: transparent; stroke-width: 2; }
.gnode .dot { fill: var(--bg); stroke: var(--ink); stroke-width: 1.4;
  transition: stroke .16s, fill .16s; }
.gnode.missing .dot { stroke: var(--warn); stroke-dasharray: 2.4 2; }
.gnode.collapsed .dot { fill: var(--ink); }
.gnode.missing.collapsed .dot { fill: var(--warn); }
.gnode.lit .dot { stroke: var(--accent); stroke-dasharray: none; }
.gnode.lit.collapsed .dot { fill: var(--accent); }
.gnode:focus-visible .ring, .gnode.sel .ring { stroke: var(--accent); }
.label {
  fill: var(--ink); font-family: var(--mono); font-size: var(--label-size);
  paint-order: stroke; stroke: var(--bg); stroke-width: 4px;
  stroke-linejoin: round; dominant-baseline: central;
}
.label .more { fill: var(--muted); }
.gnode.root .label { font-size: var(--root-size); font-weight: 600; }
.gnode.hover .label, .gnode.sel .label, .gnode.match .label { fill: var(--accent); }
.gnode.match .dot { stroke: var(--accent); stroke-width: 2.2; }
.focusing .gnode:not(.lit) { opacity: .25; }
.focusing .edge:not(.lit) { opacity: .15; }
.searching.focusing .gnode.match:not(.lit) { opacity: .75; }
.searching:not(.focusing) .gnode:not(.match) { opacity: .35; }
.searching:not(.focusing) .edge { opacity: .35; }
@media (prefers-reduced-motion: reduce) {
  .edge.lit { animation: none; stroke-dasharray: none; }
  .edge, .gnode, .gnode .dot { transition: none; }
}

.float { position: absolute; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); }
.stats { top: 14px; left: 14px; width: 300px; font-size: 12px;
  max-width: calc(100% - 28px); }
.stats-head { display: flex; width: 100%; align-items: center; gap: 8px;
  justify-content: space-between; border: 0; background: none; padding: 8px 12px;
  font-size: 13px; font-weight: 600; text-align: left; border-radius: 10px; }
.stats-head svg { width: 14px; height: 14px; flex: none; fill: none;
  stroke: var(--muted); stroke-width: 2; stroke-linecap: round;
  stroke-linejoin: round; transition: transform .16s; }
.stats-head[aria-expanded="false"] svg { transform: rotate(-90deg); }
.stats-body { padding: 0 12px 10px; }
.levels { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px;
  align-items: center; margin-bottom: 10px; max-height: 150px; overflow-y: auto; }
.lv-name, .lv-n { font-family: var(--mono); color: var(--muted); }
.lv-n { text-align: right; color: var(--ink); }
.lv-track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.lv-bar { height: 100%; border-radius: 3px; background: var(--accent); min-width: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
  background: var(--bg); border-radius: 999px; padding: 3px 9px 3px 7px;
  font-size: 12px; }
.chip:not(:disabled):hover { border-color: var(--accent); }
.chip:disabled { cursor: default; }
.chip[aria-pressed="true"] { border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, transparent); }
.chip svg { width: 12px; height: 12px; }
.chip circle { stroke-width: 1.4; }
.chip.warn:not(:disabled) { color: var(--warn); }
.hint { margin: 8px 0 0; color: var(--muted); font-size: 11.5px; }
@media (prefers-reduced-motion: reduce) { .stats-head svg { transition: none; } }
.zoom { left: 14px; bottom: 14px; display: flex; align-items: center; padding: 3px; }
.zoom button { border: 0; background: none; width: 36px; height: 36px;
  border-radius: 7px; display: grid; place-items: center; }
.zoom button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.zoom #zoomLevel { width: 56px; font-family: var(--mono); font-size: 12px; }
.zoom svg { width: 17px; height: 17px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.zoom .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.mini { right: 14px; bottom: 14px; width: 200px; height: 130px; cursor: crosshair;
  touch-action: none; }
.mini-edge { stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.mini-dot { fill: var(--ink); }
.mini-dot.missing { fill: var(--warn); }
.mini-dot.match { fill: var(--accent); }
#miniView { fill: color-mix(in srgb, var(--accent) 10%, transparent);
  stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.detail { top: 14px; right: 14px; width: 340px; padding: 14px 16px 16px;
  max-height: calc(100% - 172px); overflow: auto; }
.detail-head { display: flex; gap: 8px; align-items: flex-start; }
.crumbs { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
.crumbs button { border: 0; background: none; padding: 0; color: var(--muted);
  text-align: left; max-width: 100%; }
.crumbs button:hover { color: var(--accent); text-decoration: underline; }
.crumbs .sepr { margin: 0 4px; }
.close { border: 0; background: none; width: 30px; height: 30px; flex: none;
  border-radius: 6px; display: grid; place-items: center; margin: -5px -8px 0 0; }
.close:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.close svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2;
  fill: none; stroke-linecap: round; }
.detail h3 { margin: 6px 0 4px; font-size: 16px; line-height: 1.35;
  overflow-wrap: anywhere; }
.dmeta { margin: 0 0 10px; font-family: var(--mono); font-size: 12px;
  color: var(--muted); }
.dstats { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px;
  margin: 0 0 12px; font-size: 12.5px; }
.dstats dt { color: var(--muted); }
.dstats dd { margin: 0; font-family: var(--mono); }
.dsum { margin: 0 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.dsum.empty { color: var(--warn); font-style: italic; }
.dactions { display: flex; gap: 8px; flex-wrap: wrap; }
.dactions button { border: 1px solid var(--line); background: var(--bg);
  padding: 6px 11px; border-radius: 8px; }
.dactions button:hover { border-color: var(--accent); }

@media (max-width: 720px) {
  .shell { flex-direction: column; height: auto; min-height: 100vh; }
  nav.docs { width: 100%; max-height: 200px; border-right: 0;
    border-bottom: 1px solid var(--line); }
  main { min-height: 100vh; }
  .head, .bar { padding-left: 16px; padding-right: 16px; }
  .list { padding: 16px; }
  .graph { min-height: 70vh; }
  .sum { margin-left: 22px; }
  .mini { display: none; }
  .detail { top: auto; left: 12px; right: 12px; bottom: 60px; width: auto;
    max-height: 55%; }
}
</style>
<script>
// `?embed` shows the page inside another one (an iframe on a web page): only the
// board and its search bar, the host page keeps its own scrolling, and the host
// sets the theme with `?theme=dark` or a message instead of a stored choice.
const embedded = new URLSearchParams(location.search).has("embed");
if (embedded) document.documentElement.classList.add("embed");
// Light unless chosen otherwise; set here so the page never flashes light.
try {
  const theme = embedded ? new URLSearchParams(location.search).get("theme")
                         : localStorage.getItem("pageindex-viewer-theme");
  if (theme === "dark") document.documentElement.dataset.theme = "dark";
} catch (error) {}
</script>
</head>
<body>
<div class="shell">
  <nav class="docs" aria-label="Documents"><h1>Documents</h1><div id="docs"></div></nav>
  <main>
    <header class="head">
      <div><h2 id="docName"></h2><p id="docMeta"></p></div>
      <div class="head-tools">
        <div class="seg" role="tablist" aria-label="View">
          <button role="tab" id="tabGraph" aria-controls="graphView">Graph</button>
          <button role="tab" id="tabList" aria-controls="listView">List</button>
        </div>
        <button class="theme" id="theme" aria-pressed="false" aria-label="Dark theme" title="Dark theme">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>
    <div class="bar">
      <input type="search" id="q" placeholder="Search titles and summaries"
             aria-label="Search titles and summaries">
      <span class="hits" id="hits" aria-live="polite"></span>
      <label class="chk"><input type="checkbox" id="onlyMissing">
        Without summary</label>
      <div class="seg graph-only" role="group" aria-label="Layout">
        <button id="layTree" aria-pressed="true">Tree</button>
        <button id="layRadial" aria-pressed="false">Radial</button>
      </div>
      <button id="expand">Expand all</button>
      <button id="collapse">Collapse all</button>
    </div>

    <section id="graphView" class="view graph" role="tabpanel" aria-labelledby="tabGraph">
      <div id="board" class="board" tabindex="0"
           aria-label="Section graph. Drag to move, Ctrl or Command with scroll to zoom, F to fit.">
        <svg id="stage" aria-hidden="false">
          <g id="world"><g id="edges"></g><g id="nodes"></g></g>
        </svg>
      </div>
      <section id="stats" class="float stats" aria-label="Tree statistics">
        <button id="statsToggle" class="stats-head" aria-expanded="true" aria-controls="statsBody">
          <span id="statsLine"></span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="statsBody" class="stats-body">
          <div id="levels" class="levels" role="list" aria-label="Sections per level"></div>
          <div class="chips">
            <button class="chip" id="chipSummarized" disabled><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor"/></svg><span></span></button>
            <button class="chip warn" id="chipMissing" aria-pressed="false" title="Show only sections without a summary"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-dasharray="2.4 2"/></svg><span></span></button>
            <button class="chip" id="chipFolded" title="Unfold every branch"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="currentColor" stroke="currentColor"/></svg><span></span></button>
          </div>
          <p class="hint"><span class="hint-mouse">drag to move · ⌘/Ctrl + scroll to zoom · click a circle to fold</span><span class="hint-touch">drag sideways or with two fingers to move · pinch to zoom · tap a circle to fold</span></p>
        </div>
      </section>
      <div class="float zoom" role="group" aria-label="Zoom">
        <button id="zoomOut" aria-label="Zoom out" title="Zoom out (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="zoomLevel" aria-label="Reset zoom to 100%" title="Reset to 100% (0)">100%</button>
        <button id="zoomIn" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
        <span class="sep"></span>
        <button id="zoomFit" aria-label="Fit the whole tree" title="Fit (F)"><svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></button>
      </div>
      <svg id="mini" class="float mini" aria-label="Overview; click or drag to move the board" role="img">
        <g id="miniNodes"></g><rect id="miniView" rx="2"></rect>
      </svg>
      <aside id="detail" class="float detail" aria-label="Section detail" hidden>
        <div class="detail-head">
          <div class="crumbs" id="crumbs"></div>
          <button class="close" id="closeDetail" aria-label="Close detail"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <h3 id="dTitle"></h3>
        <p class="dmeta" id="dMeta"></p>
        <dl class="dstats" id="dStats"></dl>
        <p class="dsum" id="dSum"></p>
        <div class="dactions">
          <button id="dToggle"></button>
          <button id="dFocus">Zoom to section</button>
        </div>
      </aside>
    </section>

    <section id="listView" class="view list" role="tabpanel" aria-labelledby="tabList" hidden>
      <div id="tree"></div>
    </section>
    <footer id="foot"></footer>
  </main>
</div>
<script id="payload" type="application/json">__DATA__</script>
<script>
const data = JSON.parse(document.getElementById("payload").textContent);
const $ = id => document.getElementById(id);
const docsEl = $("docs");
const treeEl = $("tree");
const q = $("q");
const onlyMissing = $("onlyMissing");
let current = 0;
let activeView = "graph";

function counts(nodes, acc = {total: 0, summarized: 0}) {
  for (const node of nodes) {
    acc.total++;
    if (node.summary) acc.summarized++;
    counts(node.nodes || [], acc);
  }
  return acc;
}

function element(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// The one test both views use to decide whether a section matches the bar.
function needle() { return q.value.trim().toLowerCase(); }
function matches(title, summary, text, missingOnly) {
  return (!text || (title + " " + (summary || "")).toLowerCase().includes(text)) &&
         (!missingOnly || !summary);
}

data.documents.forEach((doc, index) => {
  const c = counts(doc.nodes);
  const button = document.createElement("button");
  button.append(doc.name);
  const meta = element("span", "meta",
                       `${c.summarized}/${c.total} summarized · ${doc.units} units`);
  button.append(meta);
  button.onclick = () => select(index);
  docsEl.append(button);
});

/* ---------------------------------------------------------------- list view */

function draw(nodes, depth) {
  const box = element("div", depth ? "node" : "");
  for (const node of nodes) {
    const wrap = element("div");
    const row = element("div", "row" + (node.summary ? "" : " missing"));
    const children = node.nodes || [];
    const twist = element("button", "twist" + (children.length ? "" : " leaf"),
                          children.length ? "▾" : "·");
    row.append(twist, element("span", "nid", node.id),
               element("span", "title", node.title),
               element("span", "units", `[${node.start}–${node.end}]`));
    wrap.append(row);
    if (node.summary) wrap.append(element("p", "sum", node.summary));
    if (children.length) {
      const kids = draw(children, depth + 1);
      wrap.append(kids);
      twist.onclick = () => {
        const hide = !kids.classList.contains("hidden");
        kids.classList.toggle("hidden", hide);
        twist.textContent = hide ? "▸" : "▾";
      };
    }
    wrap.dataset.title = node.title;
    if (node.summary) wrap.dataset.summary = node.summary;
    box.append(wrap);
  }
  return box;
}

function setAll(hidden) {
  treeEl.querySelectorAll(".node").forEach(node =>
    node.classList.toggle("hidden", hidden));
  treeEl.querySelectorAll(".twist:not(.leaf)").forEach(twist =>
    twist.textContent = hidden ? "▸" : "▾");
}

function paint(target, text, term) {
  if (!target) return;
  if (!term) { target.textContent = text; return; }
  const parts = text.toLowerCase().split(term);
  const fragment = document.createDocumentFragment();
  let at = 0;
  parts.forEach((part, index) => {
    fragment.append(text.slice(at, at + part.length));
    at += part.length;
    if (index < parts.length - 1) {
      fragment.append(element("mark", "", text.slice(at, at + term.length)));
      at += term.length;
    }
  });
  target.replaceChildren(fragment);
}

function listFilter() {
  const text = needle();
  const missingOnly = onlyMissing.checked;
  const walk = (box) => {
    let anyVisible = false;
    for (const wrap of box.children) {
      if (wrap.dataset.title === undefined) continue;
      const kids = wrap.querySelector(":scope > .node");
      const childVisible = kids ? walk(kids) : false;
      const hit = matches(wrap.dataset.title, wrap.dataset.summary, text, missingOnly);
      const visible = hit || childVisible;
      wrap.classList.toggle("hidden", !visible);
      if (visible) {
        paint(wrap.querySelector(":scope > .row > .title"), wrap.dataset.title, text);
        paint(wrap.querySelector(":scope > .sum"), wrap.dataset.summary, text);
      }
      if (kids && (text || missingOnly) && childVisible) {
        kids.classList.remove("hidden");
        const twist = wrap.querySelector(":scope > .row > .twist");
        if (twist) twist.textContent = "▾";
      }
      anyVisible = anyVisible || visible;
    }
    return anyVisible;
  };
  walk(treeEl.firstElementChild);
}

/* --------------------------------------------------------------- graph view */

const SVG_NS = "http://www.w3.org/2000/svg";
const GRAPH = {
  radius: 5.5,       // node circle
  labelPad: 8,       // gap from the circle to its label, and from the label to its edges
  labelSize: 12.5,   // px, section labels
  rootSize: 15,      // px, the document's own label
  moreGap: 6,        // gap before the "+N" count on a folded section
  labelChars: 40,    // longer titles are cut here; the detail panel shows them whole
  row: 30,           // vertical pitch between leaves in the tree layout
  gap: 64,           // room left for edges between one column's labels and the next column
  leafArc: 24,       // arc length each leaf gets on the innermost ring of the radial layout
  ringGap: 56,       // room left for edges between one ring's labels and the next ring
  grid: 24,          // background dot spacing at 100% zoom
  minZoom: 0.05,
  maxZoom: 3,
  fitPad: 48,        // margin kept around the tree when fitting it to the board
  readableZoom: 0.75, // a document opens no smaller than this, even when the tree then overflows
  flight: 280,       // ms for animated camera moves
  openLimit: 400,    // a tree with more sections than this opens folded below openDepth
  openDepth: 2,
};
const board = $("board"), stage = $("stage"), world = $("world");
const edgesG = $("edges"), nodesG = $("nodes");
const mini = $("mini"), miniG = $("miniNodes"), miniView = $("miniView");
const detail = $("detail"), stats = $("stats");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const narrow = matchMedia("(max-width: 720px)");
const cam = {x: 0, y: 0, k: 1};
let graph = null;       // {root, all, visible}
let layoutMode = "tree";
let hovered = null, selected = null;
let hitSet = new Set(), hitList = [], hitAt = -1;
let needsFit = true;

stage.style.setProperty("--label-size", GRAPH.labelSize + "px");
stage.style.setProperty("--root-size", GRAPH.rootSize + "px");

function svg(tag, attrs, parent) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs || {})) el.setAttribute(key, value);
  if (parent) parent.append(el);
  return el;
}

function buildGraph(doc) {
  const all = [];
  const make = (src, parent) => {
    const node = {
      key: all.length, id: src.id ?? null, title: src.title || "(untitled)",
      summary: src.summary || "", start: src.start, end: src.end,
      depth: parent ? parent.depth + 1 : 0, parent, collapsed: false,
      isRoot: !parent, children: [],
    };
    all.push(node);
    node.children = (src.nodes || []).map(child => make(child, node));
    return node;
  };
  const root = make({title: doc.name, summary: doc.description, nodes: doc.nodes}, null);
  if (all.length > GRAPH.openLimit) {
    for (const node of all)
      if (node.depth >= GRAPH.openDepth && node.children.length) node.collapsed = true;
  }
  return {root, all, visible: []};
}

const shown = node => node.collapsed ? [] : node.children;
function eachShown(node, fn) { fn(node); for (const child of shown(node)) eachShown(child, fn); }
function descendants(node) {
  let total = 0;
  for (const child of node.children) total += 1 + descendants(child);
  return total;
}
function isShown(node) {
  for (let up = node.parent; up; up = up.parent) if (up.collapsed) return false;
  return true;
}

const measureCtx = document.createElement("canvas").getContext("2d");
const monoFamily = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();
function textWidth(text, size, weight) {
  measureCtx.font = `${weight || 400} ${size}px ${monoFamily}`;
  return measureCtx.measureText(text).width;
}

function measure(node) {
  const title = node.title;
  node.text = title.length > GRAPH.labelChars
    ? title.slice(0, GRAPH.labelChars - 1) + "…" : title;
  node.more = node.collapsed && node.children.length ? `+${descendants(node)}` : "";
  node.w = node.isRoot
    ? textWidth(node.text, GRAPH.rootSize, 600)
    : textWidth(node.text, GRAPH.labelSize) +
      (node.more ? GRAPH.moreGap + textWidth(node.more, GRAPH.labelSize) : 0);
}

// Distance from a node's centre to where its outgoing edges start: past its label,
// so an edge never runs through the text. The root's label sits on the other side.
function reach(node) {
  return node.isRoot ? GRAPH.radius : GRAPH.radius + GRAPH.labelPad + node.w + GRAPH.labelPad;
}

// Widest reach per depth, over the nodes that have edges leaving them. A leaf's label
// can run into the next column freely, because no other node shares a leaf's row.
function reachByDepth(root) {
  const widest = [];
  eachShown(root, node => {
    if (shown(node).length) widest[node.depth] = Math.max(widest[node.depth] || 0, reach(node));
  });
  return widest;
}

function layoutTree(root) {
  const widest = reachByDepth(root);
  const colX = [0];
  for (let depth = 1; depth <= widest.length; depth++)
    colX[depth] = colX[depth - 1] + (widest[depth - 1] || 0) + GRAPH.gap + GRAPH.radius;
  let y = 0;
  const place = node => {
    node.x = colX[node.depth];
    const kids = shown(node);
    if (kids.length) {
      kids.forEach(place);
      node.y = (kids[0].y + kids[kids.length - 1].y) / 2;
    } else {
      node.y = y;
      y += GRAPH.row;
    }
    node.angle = 0;
  };
  place(root);
}

function layoutRadial(root) {
  const leaves = [];
  eachShown(root, node => { if (!node.isRoot && !shown(node).length) leaves.push(node); });
  const widest = reachByDepth(root);
  const ring = [0, Math.max(leaves.length * GRAPH.leafArc / (2 * Math.PI),
                            GRAPH.radius * 2 + GRAPH.ringGap * 2)];
  for (let depth = 2; depth <= widest.length; depth++)
    ring[depth] = ring[depth - 1] + (widest[depth - 1] || 0) + GRAPH.ringGap + GRAPH.radius;
  leaves.forEach((leaf, index) =>
    leaf.angle = (index + 0.5) / leaves.length * 2 * Math.PI - Math.PI / 2);
  const place = node => {
    const kids = shown(node);
    if (kids.length) {
      kids.forEach(place);
      node.angle = (kids[0].angle + kids[kids.length - 1].angle) / 2;
    }
    node.r = ring[node.depth];
    node.x = node.r * Math.cos(node.angle);
    node.y = node.r * Math.sin(node.angle);
  };
  place(root);
  root.angle = 0;
}

// The two far corners of a node's circle-plus-label, for fitting and the overview.
function extent(node) {
  const R = GRAPH.radius, far = reach(node);
  if (layoutMode === "tree") {
    return node.isRoot ? [[node.x - R - GRAPH.labelPad - node.w, node.y], [node.x + R, node.y]]
                       : [[node.x - R, node.y], [node.x + far, node.y]];
  }
  if (node.isRoot) {
    const below = node.y + R + GRAPH.labelPad + GRAPH.rootSize;
    return [[node.x - node.w / 2, below], [node.x + node.w / 2, node.y - R]];
  }
  return [[node.x, node.y],
          [node.x + far * Math.cos(node.angle), node.y + far * Math.sin(node.angle)]];
}

function bounds(nodes) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const half = GRAPH.row / 2;
  for (const node of nodes) {
    for (const [x, y] of extent(node)) {
      x0 = Math.min(x0, x - half); x1 = Math.max(x1, x + half);
      y0 = Math.min(y0, y - half); y1 = Math.max(y1, y + half);
    }
  }
  if (x0 === Infinity) return {x0: 0, y0: 0, w: 1, h: 1};
  return {x0, y0, w: x1 - x0, h: y1 - y0};
}

function edgePath(parent, child) {
  const R = GRAPH.radius;
  if (layoutMode === "tree") {
    const sx = parent.x + reach(parent), sy = parent.y;
    const ex = child.x - R, ey = child.y, mx = (sx + ex) / 2;
    return `M${sx},${sy} C${mx},${sy} ${mx},${ey} ${ex},${ey}`;
  }
  const from = parent.isRoot ? child.angle : parent.angle;
  const r0 = parent.r + reach(parent), r1 = child.r - R, rm = (r0 + r1) / 2;
  const at = (angle, r) => `${r * Math.cos(angle)},${r * Math.sin(angle)}`;
  return `M${at(from, r0)} C${at(from, rm)} ${at(child.angle, rm)} ${at(child.angle, r1)}`;
}

function labelAttrs(node) {
  const offset = GRAPH.radius + GRAPH.labelPad;
  if (layoutMode === "tree") {
    return node.isRoot ? {class: "label", x: -offset, "text-anchor": "end"}
                       : {class: "label", x: offset};
  }
  if (node.isRoot)
    return {class: "label", y: offset + GRAPH.rootSize / 2, "text-anchor": "middle"};
  const degrees = node.angle * 180 / Math.PI;
  const left = Math.cos(node.angle) < 0;   // keep text upright on the left half
  return {class: "label", x: left ? -offset : offset,
          "text-anchor": left ? "end" : "start",
          transform: `rotate(${left ? degrees + 180 : degrees})`};
}

function ariaOf(node) {
  const parts = [node.title];
  if (node.children.length)
    parts.push(`${descendants(node)} subsections, ${node.collapsed ? "folded" : "open"}`);
  if (!node.isRoot && !node.summary) parts.push("no summary");
  return parts.join(". ");
}

function render() {
  const focusedKey = document.activeElement?.dataset?.key;
  edgesG.replaceChildren();
  nodesG.replaceChildren();
  const visible = [];
  eachShown(graph.root, node => {
    visible.push(node);
    node.edgeEl = null;
    if (node.parent) {
      const d = edgePath(node.parent, node);
      node.edgeEl = svg("path", {class: "edge", d}, edgesG);
      svg("path", {class: "edge-hit", d, "data-key": node.key}, edgesG);
    }
    const cls = ["gnode", node.isRoot && "root",
                 !node.isRoot && !node.summary && "missing",
                 node.more && "collapsed", hitSet.has(node) && "match",
                 node === selected && "sel"].filter(Boolean).join(" ");
    const el = svg("g", {class: cls, transform: `translate(${node.x},${node.y})`,
                         tabindex: 0, role: "button", "data-key": node.key,
                         "aria-label": ariaOf(node)}, nodesG);
    if (node.children.length)
      svg("circle", {class: "hitc", r: GRAPH.radius * 2.2, "data-toggle": ""}, el);
    svg("circle", {class: "ring", r: GRAPH.radius + 3.5}, el);
    svg("circle", {class: "dot", r: GRAPH.radius}, el);
    const label = svg("text", labelAttrs(node), el);
    label.append(node.text);
    if (node.more) svg("tspan", {class: "more", dx: GRAPH.moreGap}, label).append(node.more);
    svg("title", {}, el).textContent = node.title;
    node.el = el;
  });
  graph.visible = visible;
  if (focusedKey !== undefined) graph.all[+focusedKey]?.el?.focus({preventScroll: true});
  renderMini();
}

function relayout() {
  for (const node of graph.all) measure(node);
  (layoutMode === "tree" ? layoutTree : layoutRadial)(graph.root);
  render();
  light(selected && isShown(selected) ? selected : null);
  apply();
  updateStats();
}

/* statistics */

const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;

// Counts over everything below a node, at every depth, folded or not.
function treeStats(node) {
  const stats = {sections: 0, leaves: 0, summarized: 0, levels: []};
  const walk = parent => {
    for (const child of parent.children) {
      stats.sections++;
      if (!child.children.length) stats.leaves++;
      if (child.summary) stats.summarized++;
      const level = child.depth - node.depth - 1;
      stats.levels[level] = (stats.levels[level] || 0) + 1;
      walk(child);
    }
  };
  walk(node);
  return stats;
}

function updateStats() {
  const stats = treeStats(graph.root);
  $("statsLine").textContent = [plural(stats.sections, "section"),
    plural(stats.levels.length, "level"), plural(stats.leaves, "leaf", "leaves")].join(" · ");
  const levels = $("levels");
  levels.replaceChildren();
  const widest = Math.max(1, ...stats.levels);
  stats.levels.forEach((count, index) => {
    const track = element("div", "lv-track");
    const bar = element("div", "lv-bar");
    bar.style.width = `${count / widest * 100}%`;
    track.append(bar);
    const name = element("span", "lv-name", `L${index + 1}`);
    name.setAttribute("role", "listitem");
    name.setAttribute("aria-label", `level ${index + 1}: ${plural(count, "section")}`);
    levels.append(name, track, element("span", "lv-n", count));
  });
  const missing = stats.sections - stats.summarized;
  $("chipSummarized").lastElementChild.textContent =
    `${stats.summarized}/${stats.sections} summarized`;
  const chipMissing = $("chipMissing");
  chipMissing.lastElementChild.textContent = `${missing} no summary`;
  chipMissing.disabled = !missing && !onlyMissing.checked;
  chipMissing.setAttribute("aria-pressed", String(onlyMissing.checked));
  const folded = graph.all.filter(node => node.collapsed && node.children.length && isShown(node));
  const hidden = folded.reduce((total, node) => total + descendants(node), 0);
  const chipFolded = $("chipFolded");
  chipFolded.lastElementChild.textContent = folded.length
    ? `${plural(folded.length, "folded branch", "folded branches")} · ${hidden} hidden`
    : "nothing folded";
  chipFolded.disabled = !folded.length;
}

function setStatsOpen(open) {
  $("statsToggle").setAttribute("aria-expanded", String(open));
  $("statsBody").hidden = !open;
}
// only a choice the viewer made is remembered, so the default can still differ by screen size
$("statsToggle").onclick = () => {
  const open = $("statsToggle").getAttribute("aria-expanded") !== "true";
  setStatsOpen(open);
  try { localStorage.setItem("pageindex-viewer-stats", open ? "open" : "closed"); } catch (error) {}
};
$("chipMissing").onclick = () => { onlyMissing.checked = !onlyMissing.checked; filter(); };
$("chipFolded").onclick = () => unfoldAll();
{
  let stored = null;
  try { stored = localStorage.getItem("pageindex-viewer-stats"); } catch (error) {}
  setStatsOpen(stored ? stored === "open" : !narrow.matches);
}

function detailStats(node) {
  const doc = data.documents[current], stats = treeStats(node), rows = [];
  if (!node.isRoot) rows.push(["Level", node.depth]);
  if (node.children.length) {
    rows.push(["Children", node.children.length]);
    // only when they add something: with no grandchildren both equal the children
    if (stats.sections > node.children.length) rows.push(["Below", stats.sections]);
    if (stats.leaves !== stats.sections) rows.push(["Leaves", stats.leaves]);
    rows.push(["Summarized", `${stats.summarized}/${stats.sections}`]);
  }
  if (!node.isRoot && node.start != null && doc.units) {
    const span = (node.end ?? node.start) - node.start + 1, share = span / doc.units * 100;
    rows.push(["Coverage", `${span} of ${doc.units} units (${share.toFixed(share < 10 ? 1 : 0)}%)`]);
  }
  const list = $("dStats");
  list.replaceChildren();
  for (const [term, value] of rows) list.append(element("dt", "", term), element("dd", "", value));
  list.hidden = !rows.length;
}

// Light a node's path from the root and everything under it; the rest dims.
function light(node) {
  for (const el of stage.querySelectorAll(".lit, .hover")) el.classList.remove("lit", "hover");
  stage.classList.toggle("focusing", !!node);
  if (!node) return;
  node.el.classList.add("hover");
  const on = new Set();
  for (let up = node; up; up = up.parent) on.add(up);
  eachShown(node, below => on.add(below));
  for (const member of on) {
    member.el.classList.add("lit");
    if (member.parent && on.has(member.parent)) member.edgeEl.classList.add("lit");
  }
}

/* camera */

const clampZoom = k => Math.min(GRAPH.maxZoom, Math.max(GRAPH.minZoom, k));
let flight = 0;

function apply() {
  world.setAttribute("transform", `translate(${cam.x} ${cam.y}) scale(${cam.k})`);
  let step = GRAPH.grid * cam.k;
  while (step < 12) step *= 2;
  board.style.backgroundSize = `${step}px ${step}px`;
  board.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
  $("zoomLevel").textContent = Math.round(cam.k * 100) + "%";
  drawMiniView();
}

// The part of the board not covered by the statistics card on the left or the
// detail panel on the right. On a narrow screen both sit over the board instead.
function viewport() {
  const rect = board.getBoundingClientRect();
  const statsOpen = !$("statsBody").hidden && !narrow.matches;
  const left = statsOpen ? stats.offsetLeft + stats.offsetWidth : 0;
  const right = !detail.hidden && !narrow.matches ? detail.offsetWidth + 28 : 0;
  const w = Math.max(rect.width - left - right, 1), h = rect.height;
  return {left, w, h, cx: left + w / 2, cy: h / 2};
}

function moveTo(target, instant) {
  cancelAnimationFrame(flight);
  if (instant || reduceMotion.matches) { Object.assign(cam, target); apply(); return; }
  const from = {...cam}, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / GRAPH.flight), ease = 1 - Math.pow(1 - t, 3);
    for (const key of ["x", "y", "k"]) cam[key] = from[key] + (target[key] - from[key]) * ease;
    apply();
    if (t < 1) flight = requestAnimationFrame(step);
  };
  flight = requestAnimationFrame(step);
}

function zoomAt(px, py, factor) {
  cancelAnimationFrame(flight);
  const k = clampZoom(cam.k * factor);
  cam.x = px - (px - cam.x) * k / cam.k;
  cam.y = py - (py - cam.y) * k / cam.k;
  cam.k = k;
  apply();
}

function zoomCentre(factor) {
  const view = viewport();
  zoomAt(view.cx, view.cy, factor);
}

function fitTo(nodes, maxZoom, instant) {
  const box = bounds(nodes), view = viewport(), pad = GRAPH.fitPad;
  const k = clampZoom(Math.min((view.w - 2 * pad) / box.w, (view.h - 2 * pad) / box.h, maxZoom));
  moveTo({k, x: view.cx - (box.x0 + box.w / 2) * k,
          y: view.cy - (box.y0 + box.h / 2) * k}, instant);
}
const fitAll = instant => fitTo(graph.visible, 1, instant);

// The first view of a document: the whole tree when it is still legible at that size,
// otherwise the root at a readable zoom, with the rest a drag away.
function openView() {
  const box = bounds(graph.visible), view = viewport(), pad = GRAPH.fitPad;
  const fit = Math.min((view.w - 2 * pad) / box.w, (view.h - 2 * pad) / box.h, 1);
  if (fit >= GRAPH.readableZoom) { fitAll(true); return; }
  const k = GRAPH.readableZoom, root = graph.root;
  const x = layoutMode === "tree" ? view.left + pad - box.x0 * k : view.cx - root.x * k;
  moveTo({k, x, y: view.cy - root.y * k}, true);
}

function centreOn(node) {
  const view = viewport(), k = Math.max(cam.k, 0.9);
  const [a, b] = extent(node);
  moveTo({k, x: view.cx - (a[0] + b[0]) / 2 * k, y: view.cy - (a[1] + b[1]) / 2 * k});
}

function onScreen(node) {
  const view = viewport(), x = cam.x + node.x * cam.k, y = cam.y + node.y * cam.k;
  return x > view.left + 20 && y > 20 && x < view.left + view.w - 20 && y < view.h - 20;
}

/* folding and selection */

function toggle(node) {
  if (!node.children.length) return;
  const before = {x: cam.x + node.x * cam.k, y: cam.y + node.y * cam.k};
  node.collapsed = !node.collapsed;
  relayout();
  // keep the node that was clicked where it was on screen
  cam.x += before.x - (cam.x + node.x * cam.k);
  cam.y += before.y - (cam.y + node.y * cam.k);
  apply();
  if (node === selected) showDetail(node);
}

function selectNode(node) {
  selected = node;
  for (const el of nodesG.querySelectorAll(".sel")) el.classList.remove("sel");
  if (!node) { detail.hidden = true; light(null); return; }
  node.el.classList.add("sel");
  showDetail(node);
  light(node);
}

function units(start, end) {
  if (start == null) return "";
  return start === end || end == null ? `unit ${start}` : `units ${start}–${end}`;
}

function showDetail(node) {
  const doc = data.documents[current];
  const crumbs = $("crumbs");
  crumbs.replaceChildren();
  const trail = [];
  for (let up = node.parent; up; up = up.parent) trail.unshift(up);
  trail.forEach((up, index) => {
    if (index) crumbs.append(element("span", "sepr", "›"));
    const link = element("button", "", up.text);
    link.onclick = () => { for (let a = up; a; a = a.parent) a.collapsed = false;
                           relayout(); selectNode(up); centreOn(up); };
    crumbs.append(link);
  });
  $("dTitle").textContent = node.title;
  const meta = node.isRoot
    ? [doc.units != null && `${doc.units} units`, doc.source]
    : [node.id && `#${node.id}`, units(node.start, node.end)];
  $("dMeta").textContent = meta.filter(Boolean).join(" · ");
  detailStats(node);
  const sum = $("dSum");
  sum.textContent = node.summary || (node.isRoot ? "No description." : "No summary yet.");
  sum.classList.toggle("empty", !node.summary);
  const fold = $("dToggle");
  fold.hidden = !node.children.length;
  fold.textContent = node.collapsed ? "Unfold" : "Fold";
  detail.hidden = false;
}

$("closeDetail").onclick = () => selectNode(null);
$("dToggle").onclick = () => selected && toggle(selected);
$("dFocus").onclick = () => {
  if (!selected) return;
  const nodes = [];
  eachShown(selected, node => nodes.push(node));
  fitTo(nodes, 1.4);
};

/* pointer: drag anywhere to move, pinch or Ctrl/⌘ + wheel to zoom */

const keyOf = target => {
  const el = target && target.closest ? target.closest("[data-key]") : null;
  return el && graph ? graph.all[+el.dataset.key] : null;
};
const touches = new Map();
const drag = {moved: false, sx: 0, sy: 0, pinch: 0};

board.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button > 1) return;
  if (e.button === 1) e.preventDefault();
  cancelAnimationFrame(flight);
  touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  drag.moved = false; drag.sx = e.clientX; drag.sy = e.clientY;
  if (touches.size === 2) drag.pinch = spread();
});
function spread() {
  const [a, b] = [...touches.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
}
board.addEventListener("pointermove", e => {
  const prev = touches.get(e.pointerId);
  if (!prev) return;
  const now = {x: e.clientX, y: e.clientY};
  touches.set(e.pointerId, now);
  if (touches.size >= 2) {
    const [a, b] = [...touches.values()], rect = board.getBoundingClientRect();
    const distance = spread();
    // the midpoint moves by half of what this one finger moved: two fingers also pan
    cam.x += (now.x - prev.x) / 2;
    cam.y += (now.y - prev.y) / 2;
    if (drag.pinch)
      zoomAt((a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top, distance / drag.pinch);
    drag.pinch = distance;
    drag.moved = true;
    return;
  }
  if (!drag.moved) {
    if (Math.hypot(now.x - drag.sx, now.y - drag.sy) < 4) return;
    // capture only once it is a drag, so a plain click still lands on the node under it
    drag.moved = true;
    board.setPointerCapture(e.pointerId);
    board.classList.add("panning");
  }
  cam.x += now.x - prev.x;
  cam.y += now.y - prev.y;
  apply();
});
const release = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) drag.pinch = 0;
  if (!touches.size) board.classList.remove("panning");
};
board.addEventListener("pointerup", release);
board.addEventListener("pointercancel", release);

board.addEventListener("wheel", e => {
  const zoom = e.ctrlKey || e.metaKey;
  // embedded, a plain scroll belongs to the host page, so the board is not a scroll trap
  if (embedded && !zoom) return;
  e.preventDefault();
  cancelAnimationFrame(flight);
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? board.clientHeight : 1;
  if (zoom) {
    const rect = board.getBoundingClientRect();
    const dy = Math.max(-40, Math.min(40, e.deltaY * unit));
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-dy * 0.01));
  } else {
    cam.x -= e.deltaX * unit;
    cam.y -= e.deltaY * unit;
    apply();
  }
}, {passive: false});

stage.addEventListener("pointerover", e => {
  if (board.classList.contains("panning")) return;
  const node = keyOf(e.target);
  if (node && node !== hovered) { hovered = node; light(node); }
});
stage.addEventListener("pointerout", e => {
  const node = keyOf(e.target);
  if (!node || keyOf(e.relatedTarget) === node) return;
  hovered = null;
  light(selected && isShown(selected) ? selected : null);
});
stage.addEventListener("click", e => {
  if (drag.moved) return;
  const node = keyOf(e.target);
  if (!node) { selectNode(null); return; }
  if (e.target.closest("[data-toggle]")) toggle(node);
  else selectNode(node);
});
stage.addEventListener("dblclick", e => {
  const node = keyOf(e.target);
  if (!node || e.target.closest("[data-toggle]")) return;
  const nodes = [];
  eachShown(node, below => nodes.push(below));
  fitTo(nodes, 1.4);
});
stage.addEventListener("focusin", e => {
  const node = keyOf(e.target);
  if (!node) return;
  light(node);
  if (!onScreen(node)) centreOn(node);
});
stage.addEventListener("focusout", () =>
  light(selected && isShown(selected) ? selected : null));

$("zoomIn").onclick = () => zoomCentre(1.25);
$("zoomOut").onclick = () => zoomCentre(1 / 1.25);
$("zoomLevel").onclick = () => zoomCentre(1 / cam.k);
$("zoomFit").onclick = () => fitAll();

document.addEventListener("keydown", e => {
  if (activeView !== "graph" || !graph) return;
  const typing = e.target.matches && e.target.matches("input, textarea");
  if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const node = keyOf(e.target);
  if (node && e.key === "Enter") { e.preventDefault(); selectNode(node); return; }
  if (node && e.key === " ") { e.preventDefault(); toggle(node); return; }
  const pan = {ArrowLeft: [80, 0], ArrowRight: [-80, 0], ArrowUp: [0, 80], ArrowDown: [0, -80]};
  if (pan[e.key] && (node || e.target === board || e.target === document.body)) {
    e.preventDefault();
    cam.x += pan[e.key][0]; cam.y += pan[e.key][1]; apply();
  } else if (e.key === "+" || e.key === "=") zoomCentre(1.25);
  else if (e.key === "-") zoomCentre(1 / 1.25);
  else if (e.key === "0") zoomCentre(1 / cam.k);
  else if (e.key === "f" || e.key === "F") fitAll();
  else if (e.key === "Escape") selectNode(null);
});

/* overview */

let miniUnit = 1;
function renderMini() {
  const box = bounds(graph.visible);
  mini.setAttribute("viewBox", `${box.x0} ${box.y0} ${box.w} ${box.h}`);
  miniUnit = Math.max(box.w / (mini.clientWidth || 1), box.h / (mini.clientHeight || 1));
  miniG.replaceChildren();
  for (const node of graph.visible) {
    if (node.parent)
      svg("line", {class: "mini-edge", x1: node.parent.x, y1: node.parent.y,
                   x2: node.x, y2: node.y}, miniG);
  }
  for (const node of graph.visible) {
    const cls = ["mini-dot", !node.isRoot && !node.summary && "missing",
                 hitSet.has(node) && "match"].filter(Boolean).join(" ");
    svg("circle", {class: cls, cx: node.x, cy: node.y, r: miniUnit * 1.8}, miniG);
  }
}
function drawMiniView() {
  const rect = board.getBoundingClientRect();
  miniView.setAttribute("x", -cam.x / cam.k);
  miniView.setAttribute("y", -cam.y / cam.k);
  miniView.setAttribute("width", rect.width / cam.k);
  miniView.setAttribute("height", rect.height / cam.k);
}
function miniJump(e) {
  const point = new DOMPoint(e.clientX, e.clientY).matrixTransform(mini.getScreenCTM().inverse());
  const view = viewport();
  cancelAnimationFrame(flight);
  cam.x = view.cx - point.x * cam.k;
  cam.y = view.cy - point.y * cam.k;
  apply();
}
mini.addEventListener("pointerdown", e => { mini.setPointerCapture(e.pointerId); miniJump(e); });
mini.addEventListener("pointermove", e => { if (mini.hasPointerCapture(e.pointerId)) miniJump(e); });
addEventListener("resize", () => { if (graph && activeView === "graph") { renderMini(); apply(); } });

/* search, shared by both views */

function graphFilter() {
  const text = needle(), missingOnly = onlyMissing.checked, active = !!(text || missingOnly);
  hitList = active ? graph.all.filter(node =>
    !node.isRoot && matches(node.title, node.summary, text, missingOnly)) : [];
  hitSet = new Set(hitList);
  hitAt = -1;
  // unfold whatever hides a match, so every match is on the board
  for (const node of hitList) for (let up = node.parent; up; up = up.parent) up.collapsed = false;
  stage.classList.toggle("searching", active);
  relayout();
  $("hits").textContent = active
    ? `${hitList.length} match${hitList.length === 1 ? "" : "es"}` : "";
}

function filter() {
  listFilter();
  graphFilter();
}

q.oninput = filter;
onlyMissing.onchange = filter;
q.addEventListener("keydown", e => {
  if (e.key !== "Enter" || activeView !== "graph" || !hitList.length) return;
  e.preventDefault();
  hitAt = (hitAt + (e.shiftKey ? -1 : 1) + hitList.length) % hitList.length;
  const node = hitList[hitAt];
  selectNode(node);
  centreOn(node);
  $("hits").textContent = `${hitAt + 1} / ${hitList.length}`;
});

function unfoldAll() {
  for (const node of graph.all) node.collapsed = false;
  relayout();
  fitAll();
}
$("expand").onclick = () => {
  if (activeView === "list") { setAll(false); listFilter(); return; }
  unfoldAll();
};
$("collapse").onclick = () => {
  if (activeView === "list") { setAll(true); return; }
  for (const node of graph.all) node.collapsed = !node.isRoot && node.children.length > 0;
  relayout();
  fitAll();
};

function setLayout(mode) {
  layoutMode = mode;
  $("layTree").setAttribute("aria-pressed", String(mode === "tree"));
  $("layRadial").setAttribute("aria-pressed", String(mode === "radial"));
  relayout();
  fitAll();
}
$("layTree").onclick = () => setLayout("tree");
$("layRadial").onclick = () => setLayout("radial");

/* views and documents */

function showView(name) {
  activeView = name;
  $("tabGraph").setAttribute("aria-selected", String(name === "graph"));
  $("tabList").setAttribute("aria-selected", String(name === "list"));
  $("graphView").hidden = name !== "graph";
  $("listView").hidden = name !== "list";
  for (const el of document.querySelectorAll(".graph-only")) el.hidden = name !== "graph";
  try { localStorage.setItem("pageindex-viewer-view", name); } catch (error) {}
  if (name === "graph" && graph) {
    renderMini();
    if (needsFit) { needsFit = false; openView(); } else apply();
  }
}
$("tabGraph").onclick = () => showView("graph");
$("tabList").onclick = () => showView("list");

function select(index) {
  current = index;
  const doc = data.documents[index];
  [...docsEl.children].forEach((button, i) =>
    button.setAttribute("aria-current", String(i === index)));
  $("docName").textContent = doc.name;
  const c = counts(doc.nodes);
  const meta = $("docMeta");
  meta.textContent = [doc.description, `${c.summarized}/${c.total} nodes summarized`,
                      `${doc.units} read units`, doc.source].filter(Boolean).join(" · ");
  meta.title = meta.textContent;
  treeEl.replaceChildren(draw(doc.nodes, 0));
  graph = buildGraph(doc);
  selected = hovered = null;
  detail.hidden = true;
  filter();
  needsFit = true;
  if (activeView === "graph") { needsFit = false; openView(); }
}

function setTheme(dark) {
  if (dark) document.documentElement.dataset.theme = "dark";
  else delete document.documentElement.dataset.theme;
  $("theme").setAttribute("aria-pressed", String(dark));
  try { localStorage.setItem("pageindex-viewer-theme", dark ? "dark" : "light"); } catch (error) {}
}
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme !== "dark");
if (embedded) {
  // the host page switches the theme without reloading the frame
  addEventListener("message", e => {
    if (e.source !== parent || !e.data || e.data.type !== "pageindex-theme") return;
    if (e.data.theme === "dark") document.documentElement.dataset.theme = "dark";
    else delete document.documentElement.dataset.theme;
  });
}
$("theme").setAttribute("aria-pressed", String(document.documentElement.dataset.theme === "dark"));

$("foot").textContent = `generated ${data.generated} from ${data.store}`;
let savedView = "graph";
try { savedView = localStorage.getItem("pageindex-viewer-view") || "graph"; } catch (error) {}
showView(savedView === "list" && !embedded ? "list" : "graph");
select(0);
</script>
</body>
